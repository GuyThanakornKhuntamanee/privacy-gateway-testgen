[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway-testgen"
version = "0.3.1"
description = "Deterministic synthetic prompts, real attachment files and file-aware ground truth for privacy-aware data gateways"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Privacy Gateway Testgen contributors" }]
keywords = ["privacy", "synthetic-data", "pii", "dlp", "testing", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
privacy-gateway-testgen = "privacy_gateway_testgen.cli:main"

[project.urls]
Homepage = "https://example.invalid/privacy-gateway-testgen"

[tool.setuptools.packages.find]
where = ["src"]
